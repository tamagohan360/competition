<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像比較アンケート</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            text-align: center;
        }

        .criterion-box {
            background: #f8f9fa;
            border: 2px solid #007bff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .criterion-text {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }

        .progress {
            margin: 15px 0;
            font-size: 16px;
        }

        .progress-bar {
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #28a745;
            transition: width 0.2s;
        }

        .comparison-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            flex: 1;
            min-width: 0;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
        }

        .card:hover {
            border-color: #007bff;
        }

        .card img {
            max-width: 100%;
            height: 280px;
            object-fit: contain;
        }

        .btn {
            margin-top: 10px;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #999;
            cursor: wait;
        }

        .card:focus-visible {
            outline: 3px solid #007bff;
        }

        #nextPageButton {
            display: none;
            max-width: 300px;
            background: #007bff;
        }

        #status {
            min-height: 24px;
            margin: 15px 0;
        }

        #completeScreen {
            display: none;
        }

        @media (max-width: 600px) {
            .comparison-container {
                flex-direction: column;
            }

            .card img {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <h2>画像比較アンケート</h2>

    <div id="surveyScreen">

        <div class="progress">
            <div id="pageText">1 / 5 ページ</div>
            <div id="questionText">1 / 10 問</div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <div class="criterion-box">
            より
            <span id="criterionText" class="criterion-text"></span>
            方を選んでクリックしてください
        </div>

        <div class="comparison-container" id="comparisonContainer">

            <div class="card" id="leftCard">
                <img id="imgLeft" src="" alt="比較画像A">
                <button class="btn" id="leftButton" type="button">
                    こちらを選ぶ
                </button>
            </div>

            <div class="card" id="rightCard">
                <img id="imgRight" src="" alt="比較画像B">
                <button class="btn" id="rightButton" type="button">
                    こちらを選ぶ
                </button>
            </div>

        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <button class="btn" id="nextPageButton" type="button">
            次のページへ
        </button>

    </div>

    <div id="completeScreen">
        <h2>アンケート完了</h2>
        <p>全50問の回答が終了しました。ご協力ありがとうございました。</p>
    </div>

    <script>
        // =====================================
        // 1. 設定
        // =====================================

        const GAS_WEB_APP_URL =
            "https://script.google.com/macros/s/AKfycbwvxzENlLRCGOT1e055Hdp_vJkuQKFnA976ps8rJzpBkk1a7xC5DlgrZTo_Yf5k8sNcDg/exec";

        // 画像フォルダのパス
        // HTMLと同じ階層に画像があるなら "" に変更
        const IMAGE_BASE_PATH = "images/";

        // 画像一覧：ここにファイル名を追加・変更するだけ
        // 服の種類や色などの分類名は画面に表示しない
        const imageList = [
            "image01.jpg",
            "image02.jpg",
            "image03.jpg",
            "image04.jpg",
            "image05.jpg",
            "image06.jpg",
            "image07.jpg",
            "image08.jpg",
            "image09.jpg",
            "image10.jpg",
            "image11.jpg",
            "image12.jpg",
            "image13.jpg",
            "image14.jpg",
            "image15.jpg",
            "image16.jpg"
        ];

        // 評価基準
        const criteriaList = [
            "おしゃれな",
            "フォーマルな",
            "スタイリッシュな",
            "好みな"
        ];

        const QUESTIONS_PER_PAGE = 10;
        const TOTAL_PAGES = 5;

        // =====================================
        // 2. 回答状態
        // =====================================

        let currentPage = 1;
        let currentQuestion = 1;

        let currentLeft = "";
        let currentRight = "";
        let currentCriterion = "";

        let isSending = false;

        // 同じ回答者IDをページ移動後も使用
        // 同じブラウザのタブで再読み込みしてもIDを維持する
        let respondentId = sessionStorage.getItem(
            "comparisonRespondentId"
        );

        if (!respondentId) {
            respondentId =
                "R_" + Date.now() + "_" +
                Math.random().toString(36).slice(2, 8);

            sessionStorage.setItem(
                "comparisonRespondentId",
                respondentId
            );
        }

        // =====================================
        // 3. 画像の表示
        // =====================================

        function shuffle(array) {
            const result = [...array];

            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [result[i], result[j]] =
                    [result[j], result[i]];
            }

            return result;
        }

        function nextPair() {
            if (imageList.length < 2) {
                alert("画像を2枚以上設定してください。");
                return;
            }

            // 毎問、画像をランダムに2枚選ぶ
            const shuffled = shuffle(imageList);

            currentLeft = shuffled[0];
            currentRight = shuffled[1];

            currentCriterion =
                criteriaList[
                    Math.floor(Math.random() * criteriaList.length)
                ];

            document.getElementById("imgLeft").src =
                IMAGE_BASE_PATH + currentLeft;

            document.getElementById("imgRight").src =
                IMAGE_BASE_PATH + currentRight;

            document.getElementById("criterionText").textContent =
                "「" + currentCriterion + "」";

            updateProgress();
        }

        // =====================================
        // 4. 進捗表示
        // =====================================

        function updateProgress() {
            document.getElementById("pageText").textContent =
                currentPage + " / " + TOTAL_PAGES + " ページ";

            document.getElementById("questionText").textContent =
                currentQuestion + " / " +
                QUESTIONS_PER_PAGE + " 問";

            const completed =
                (currentPage - 1) * QUESTIONS_PER_PAGE +
                (currentQuestion - 1);

            document.getElementById("progressFill").style.width =
                (completed / (TOTAL_PAGES * QUESTIONS_PER_PAGE) * 100)
                + "%";
        }

        function setButtonsDisabled(disabled) {
            document.getElementById("leftButton").disabled = disabled;
            document.getElementById("rightButton").disabled = disabled;
        }

        // =====================================
        // 5. 回答の保存
        // =====================================

        async function selectImage(winnerSide) {
            if (isSending) return;

            isSending = true;
            setButtonsDisabled(true);

            const winnerImg =
                winnerSide === "left" ? currentLeft : currentRight;

            const loserImg =
                winnerSide === "left" ? currentRight : currentLeft;

            const payload = {
                respondent_id: respondentId,
                page_number: currentPage,
                question_number: currentQuestion,
                criterion: currentCriterion,
                winner_img: winnerImg,
                loser_img: loserImg
            };

            const status = document.getElementById("status");

            status.textContent = "回答を保存しています...";

            try {
                // GASへ回答を送信
                // no-corsではGASの応答内容・保存成功を
                // ブラウザ側で直接確認することはできない
                await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(payload)
                });

                // 1問分の送信処理後に次へ進む
                status.textContent = "";

                if (currentQuestion < QUESTIONS_PER_PAGE) {
                    currentQuestion++;
                    nextPair();

                } else {
                    // 10問終了
                    document.getElementById(
                        "comparisonContainer"
                    ).style.display = "none";

                    document.querySelector(
                        ".criterion-box"
                    ).style.display = "none";

                    document.getElementById(
                        "nextPageButton"
                    ).style.display = "inline-block";

                    status.textContent =
                        "このページの10問が終了しました。";
                }

            } catch (error) {
                console.error("送信エラー:", error);

                status.textContent =
                    "送信エラーが発生しました。再度選択してください。";

                // エラー時は回答を進めない
                setButtonsDisabled(false);
                isSending = false;
                return;
            }

            isSending = false;
            setButtonsDisabled(false);
        }

        // =====================================
        // 6. 次のページ
        // =====================================

        document.getElementById("nextPageButton").addEventListener(
            "click",
            function () {
                if (currentPage < TOTAL_PAGES) {
                    currentPage++;
                    currentQuestion = 1;

                    document.getElementById(
                        "comparisonContainer"
                    ).style.display = "flex";

                    document.querySelector(
                        ".criterion-box"
                    ).style.display = "block";

                    document.getElementById(
                        "nextPageButton"
                    ).style.display = "none";

                    nextPair();

                } else {
                    // 全50問終了
                    document.getElementById(
                        "surveyScreen"
                    ).style.display = "none";

                    document.getElementById(
                        "completeScreen"
                    ).style.display = "block";

                    document.getElementById(
                        "progressFill"
                    ).style.width = "100%";
                }
            }
        );

        // =====================================
        // 7. イベント設定
        // =====================================

        document.getElementById("leftButton").addEventListener(
            "click",
            () => selectImage("left")
        );

        document.getElementById("rightButton").addEventListener(
            "click",
            () => selectImage("right")
        );

        document.getElementById("leftCard").addEventListener(
            "click",
            function (event) {
                if (event.target.tagName !== "BUTTON") {
                    selectImage("left");
                }
            }
        );

        document.getElementById("rightCard").addEventListener(
            "click",
            function (event) {
                if (event.target.tagName !== "BUTTON") {
                    selectImage("right");
                }
            }
        );

        // =====================================
        // 8. 初期化
        // =====================================

        if (imageList.length < 2) {
            document.getElementById("status").textContent =
                "画像を2枚以上設定してください。";
        } else {
            nextPair();
        }
    </script>
</body>
</html>
