```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像比較アンケート</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            text-align: center;
        }

        .criterion-box {
            background: #f8f9fa;
            border: 2px solid #007bff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .criterion-text {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }

        .comparison-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            flex: 1;
            min-width: 0;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            background: white;
        }

        .card:hover {
            border-color: #007bff;
        }

        .card img {
            max-width: 100%;
            height: 280px;
            object-fit: contain;
        }

        .btn {
            margin-top: 10px;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #999;
            cursor: wait;
        }

        #nextPageButton {
            display: none;
            max-width: 300px;
            background: #007bff;
        }

        #surveyScreen,
        #completeScreen {
            display: none;
        }

        .progress-bar {
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #28a745;
        }

        #status {
            min-height: 24px;
        }

        @media (max-width: 600px) {
            .comparison-container {
                flex-direction: column;
            }

            .card img {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <h2>画像比較アンケート</h2>

    <div id="setupScreen">
        <p>アンケートに使用する画像フォルダを選択してください。</p>

        <input
            type="file"
            id="folderInput"
            webkitdirectory
            directory
            multiple
            accept="image/*"
        >

        <p id="folderStatus">画像フォルダを選択してください。</p>

        <button class="btn" id="startButton" disabled>
            アンケートを開始
        </button>
    </div>

    <div id="surveyScreen">

        <p id="pageText">1 / 5 ページ</p>
        <p id="questionText">1 / 10 問</p>

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="criterion-box" id="criterionBox">
            より
            <span id="criterionText" class="criterion-text"></span>
            方を選んでクリックしてください
        </div>

        <div class="comparison-container" id="comparisonContainer">

            <div class="card" id="leftCard">
                <img id="imgLeft" alt="比較画像A">
                <button class="btn" id="leftButton" type="button">
                    こちらを選ぶ
                </button>
            </div>

            <div class="card" id="rightCard">
                <img id="imgRight" alt="比較画像B">
                <button class="btn" id="rightButton" type="button">
                    こちらを選ぶ
                </button>
            </div>

        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <button class="btn" id="nextPageButton" type="button">
            次のページへ
        </button>
    </div>

    <div id="completeScreen">
        <h2>アンケート完了</h2>
        <p>全50問の回答が終了しました。ご協力ありがとうございました。</p>
    </div>

<script>
    // ========================================
    // 設定
    // ========================================

    const GAS_WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbwvxzENlLRCGOT1e055Hdp_vJkuQKFnA976ps8rJzpBkk1a7xC5DlgrZTo_Yf5k8sNcDg/exec";

    const criteriaList = [
        "おしゃれな",
        "フォーマルな",
        "スタイリッシュな",
        "好みな"
    ];

    const QUESTIONS_PER_PAGE = 10;
    const TOTAL_PAGES = 5;

    // ========================================
    // 状態
    // ========================================

    let imageFiles = [];
    let currentLeft = null;
    let currentRight = null;
    let currentCriterion = "";

    let currentPage = 1;
    let currentQuestion = 1;
    let isSending = false;

    let respondentId = sessionStorage.getItem(
        "comparisonRespondentId"
    );

    if (!respondentId) {
        respondentId =
            "R_" + Date.now() + "_" +
            Math.random().toString(36).slice(2, 8);

        sessionStorage.setItem(
            "comparisonRespondentId",
            respondentId
        );
    }

    // ========================================
    // フォルダ内の画像を読み込む
    // ========================================

    const folderInput = document.getElementById("folderInput");
    const startButton = document.getElementById("startButton");

    folderInput.addEventListener("change", function () {
        // 前回読み込んだ画像URLを解放
        imageFiles.forEach(item => URL.revokeObjectURL(item.url));

        imageFiles = Array.from(this.files)
            .filter(file => file.type.startsWith("image/"))
            .map(file => ({
                name: file.name,
                file: file,
                url: URL.createObjectURL(file)
            }));

        document.getElementById("folderStatus").textContent =
            imageFiles.length + " 枚の画像を読み込みました。";

        startButton.disabled = imageFiles.length < 2;
    });

    // ========================================
    // アンケート開始
    // ========================================

    startButton.addEventListener("click", function () {
        if (imageFiles.length < 2) {
            alert("画像を2枚以上選択してください。");
            return;
        }

        document.getElementById("setupScreen").style.display = "none";
        document.getElementById("surveyScreen").style.display = "block";

        nextPair();
    });

    // ========================================
    // 画像の組み合わせ
    // ========================================

    function nextPair() {
        const indexes = shuffle(
            imageFiles.map((_, index) => index)
        );

        currentLeft = imageFiles[indexes[0]];
        currentRight = imageFiles[indexes[1]];

        currentCriterion =
            criteriaList[
                Math.floor(Math.random() * criteriaList.length)
            ];

        document.getElementById("imgLeft").src = currentLeft.url;
        document.getElementById("imgRight").src = currentRight.url;

        document.getElementById("criterionText").textContent =
            "「" + currentCriterion + "」";

        document.getElementById("status").textContent = "";

        updateProgress();
    }

    function shuffle(array) {
        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
        }

        return result;
    }

    // ========================================
    // 進捗
    // ========================================

    function updateProgress() {
        document.getElementById("pageText").textContent =
            currentPage + " / " + TOTAL_PAGES + " ページ";

        document.getElementById("questionText").textContent =
            currentQuestion + " / " + QUESTIONS_PER_PAGE + " 問";

        const completed =
            (currentPage - 1) * QUESTIONS_PER_PAGE +
            currentQuestion - 1;

        document.getElementById("progressFill").style.width =
            completed / (TOTAL_PAGES * QUESTIONS_PER_PAGE) * 100 + "%";
    }

    function setButtonsDisabled(disabled) {
        document.getElementById("leftButton").disabled = disabled;
        document.getElementById("rightButton").disabled = disabled;
    }

    // ========================================
    // 回答を保存
    // ========================================

    async function selectImage(side) {
        if (isSending) return;

        isSending = true;
        setButtonsDisabled(true);

        const winner =
            side === "left" ? currentLeft : currentRight;

        const loser =
            side === "left" ? currentRight : currentLeft;

        const payload = {
            respondent_id: respondentId,
            page_number: currentPage,
            question_number: currentQuestion,
            criterion: currentCriterion,
            winner_img: winner.name,
            loser_img: loser.name
        };

        const status = document.getElementById("status");
        status.textContent = "回答を送信しています...";

        try {
            await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            });

            status.textContent = "";

            if (currentQuestion < QUESTIONS_PER_PAGE) {
                currentQuestion++;
                nextPair();
            } else {
                document.getElementById(
                    "comparisonContainer"
                ).style.display = "none";

                document.getElementById(
                    "criterionBox"
                ).style.display = "none";

                document.getElementById(
                    "nextPageButton"
                ).style.display = "inline-block";

                status.textContent =
                    "10問終了しました。次のページへ進んでください。";
            }

        } catch (error) {
            console.error(error);

            status.textContent =
                "送信処理でエラーが発生しました。再度選択してください。";

            setButtonsDisabled(false);
            isSending = false;
            return;
        }

        setButtonsDisabled(false);
        isSending = false;
    }

    document.getElementById("leftButton").addEventListener(
        "click", () => selectImage("left")
    );

    document.getElementById("rightButton").addEventListener(
        "click", () => selectImage("right")
    );

    document.getElementById("leftCard").addEventListener(
        "click", function (event) {
            if (event.target.tagName !== "BUTTON") {
                selectImage("left");
            }
        }
    );

    document.getElementById("rightCard").addEventListener(
        "click", function (event) {
            if (event.target.tagName !== "BUTTON") {
                selectImage("right");
            }
        }
    );

    // ========================================
    // 次のページ
    // ========================================

    document.getElementById("nextPageButton").addEventListener(
        "click", function () {
            if (currentPage < TOTAL_PAGES) {
                currentPage++;
                currentQuestion = 1;

                document.getElementById(
                    "comparisonContainer"
                ).style.display = "flex";

                document.getElementById(
                    "criterionBox"
                ).style.display = "block";

                document.getElementById(
                    "nextPageButton"
                ).style.display = "none";

                nextPair();
            } else {
                document.getElementById(
                    "surveyScreen"
                ).style.display = "none";

                document.getElementById(
                    "completeScreen"
                ).style.display = "block";

                document.getElementById(
                    "progressFill"
                ).style.width = "100%";

                imageFiles.forEach(item => URL.revokeObjectURL(item.url));
            }
        }
    );
</script>

</body>
</html>
